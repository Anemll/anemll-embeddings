<text x="40" y="115" font-size="22" font-weight="700" fill="#33415C">1. The model (runs on the Neural Engine)</text>
<text x="40" y="142" font-size="16" fill="#5A6785">Each input goes through the model once and comes out as one list of 768 numbers.</text>
<rect x="1050" y="80" width="530" height="740" rx="18" fill="#FBF6EE" stroke="#EADBC4"/>
<text x="1070" y="115" font-size="22" font-weight="700" fill="#5C4A33">2. After the model (plain math)</text>
<text x="1070" y="142" font-size="16" fill="#85735A">Compare every vector with every other one.</text>
