[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anemll-embeddings"
version = "0.1.0"
description = "EmbeddingGemma 2 on Apple Core AI / Neural Engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
demo = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]
conversion = [
    "coremltools==9.0",
]

[tool.setuptools.packages.find]
include = ["api*", "model*", "demo*", "samples*", "scripts*"]
